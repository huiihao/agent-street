<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Agent Street frosted glass icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1d31"/>
      <stop offset="1" stop-color="#132d48"/>
    </linearGradient>
    <radialGradient id="amberGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f0b429" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f0b429" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5ad1ff" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#5ad1ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#45a675" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#45a675" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="0.38" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="0.68" stop-color="#ffffff" stop-opacity="0.035"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.11"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.78"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="towerGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b5577" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#122a40" stop-opacity="0.94"/>
    </linearGradient>
    <linearGradient id="cyanGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c7f6ff" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#4bc9ee" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="redGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f19a88" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#bd5146" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="amberGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe0a0" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#d59a27" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="baseGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#398361" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#174a38" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="outerRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0c15a" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#7fb8d6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f0b429" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="blurXL" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="58"/>
    </filter>
    <filter id="blurM" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="panelShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="26" flood-color="#000000" flood-opacity="0.46"/>
    </filter>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
    <filter id="glowSmall" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="12" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.13"/>
      </feComponentTransfer>
    </filter>
    <clipPath id="outerClip">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
    <clipPath id="panelClip">
      <rect x="34" y="34" width="444" height="444" rx="92"/>
    </clipPath>
  </defs>

  <g clip-path="url(#outerClip)">
    <rect width="512" height="512" fill="url(#bg)"/>

    <!-- soft refracted colour fields behind the glass -->
    <g filter="url(#blurXL)">
      <ellipse cx="130" cy="146" rx="180" ry="170" fill="url(#amberGlow)"/>
      <ellipse cx="404" cy="170" rx="180" ry="160" fill="url(#cyanGlow)"/>
      <ellipse cx="258" cy="438" rx="220" ry="130" fill="url(#greenGlow)"/>
      <ellipse cx="388" cy="394" rx="110" ry="100" fill="#d9574a" opacity="0.14"/>
    </g>

    <!-- frosted pane -->
    <rect x="34" y="34" width="444" height="444" rx="92" fill="url(#glass)" filter="url(#panelShadow)"/>
    <rect x="34" y="34" width="444" height="444" rx="92" fill="none" stroke="url(#rim)" stroke-width="1.8"/>

    <g clip-path="url(#panelClip)">
      <!-- internal bloom and frost -->
      <ellipse cx="118" cy="106" rx="146" ry="100" fill="#ffffff" opacity="0.08" filter="url(#blurM)"/>
      <ellipse cx="416" cy="398" rx="150" ry="100" fill="#5ad1ff" opacity="0.045" filter="url(#blurM)"/>
      <rect x="34" y="34" width="444" height="444" filter="url(#noise)" opacity="0.55"/>

      <!-- top glass catchlight -->
      <path d="M86 97 Q256 52 426 97" fill="none" stroke="#ffffff" stroke-opacity="0.42" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M62 152 Q238 104 450 158" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="10" stroke-linecap="round" filter="url(#blurM)"/>

      <!-- floating green glass plinth -->
      <ellipse cx="256" cy="410" rx="134" ry="17" fill="#000000" opacity="0.30" filter="url(#blurM)"/>
      <rect x="118" y="346" width="276" height="50" rx="25" fill="url(#baseGlass)" stroke="#ffffff" stroke-opacity="0.32" stroke-width="1.4"/>
      <path d="M150 352 H362" stroke="#c7f6ff" stroke-opacity="0.32" stroke-width="1.2" stroke-linecap="round"/>

      <!-- right amber-roof house -->
      <g filter="url(#softShadow)">
        <path d="M284 292 L328 256 L372 292 Z" fill="url(#amberGlass)" stroke="#ffffff" stroke-opacity="0.38" stroke-width="1.2" stroke-linejoin="round"/>
        <rect x="292" y="290" width="72" height="60" rx="12" fill="#213b52" fill-opacity="0.92" stroke="#ffffff" stroke-opacity="0.30" stroke-width="1.2"/>
        <rect x="316" y="314" width="24" height="22" rx="5" fill="#ffe0a0" opacity="0.90"/>
      </g>

      <!-- left red-roof house -->
      <g filter="url(#softShadow)">
        <path d="M140 272 L184 234 L228 272 Z" fill="url(#redGlass)" stroke="#ffffff" stroke-opacity="0.38" stroke-width="1.2" stroke-linejoin="round"/>
        <rect x="148" y="270" width="72" height="80" rx="12" fill="#213b52" fill-opacity="0.92" stroke="#ffffff" stroke-opacity="0.30" stroke-width="1.2"/>
        <rect x="172" y="298" width="24" height="22" rx="5" fill="#ffe0a0" opacity="0.90"/>
      </g>

      <!-- central trading tower -->
      <g filter="url(#softShadow)">
        <rect x="224" y="158" width="64" height="192" rx="14" fill="url(#towerGlass)" stroke="#ffffff" stroke-opacity="0.40" stroke-width="1.3"/>
        <rect x="208" y="132" width="96" height="44" rx="18" fill="url(#cyanGlass)" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.2"/>
        <path d="M220 145 H292" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.4" stroke-linecap="round"/>
        <rect x="240" y="192" width="32" height="22" rx="6" fill="#c7f6ff" opacity="0.86"/>
        <rect x="240" y="228" width="32" height="22" rx="6" fill="#ffe0a0" opacity="0.92"/>
        <rect x="240" y="264" width="32" height="22" rx="6" fill="#c7f6ff" opacity="0.66"/>
      </g>
      <!-- beacon / candlestick wick -->
      <path d="M256 132 V112" stroke="#ffffff" stroke-opacity="0.60" stroke-width="2" stroke-linecap="round"/>
      <circle cx="256" cy="108" r="8" fill="#f0c15a" opacity="0.38" filter="url(#glowSmall)"/>
      <circle cx="256" cy="108" r="3.5" fill="#ffe6a4"/>
    </g>

    <!-- outer glass edge -->
    <rect x="2.5" y="2.5" width="507" height="507" rx="112" fill="none" stroke="url(#outerRim)" stroke-width="2"/>
  </g>
</svg>
