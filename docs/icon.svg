<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Agent Street frosted glass candlestick icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06101c"/>
      <stop offset="0.55" stop-color="#0a1d31"/>
      <stop offset="1" stop-color="#12304a"/>
    </linearGradient>
    <radialGradient id="greenGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#45d08a" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#45d08a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f0b429" stop-opacity="0.46"/>
      <stop offset="1" stop-color="#f0b429" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5ad1ff" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#5ad1ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff6b5e" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ff6b5e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="0.38" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="0.68" stop-color="#ffffff" stop-opacity="0.035"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.11"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.80"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="greenBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ff0bd" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#20b875" stop-opacity="0.94"/>
    </linearGradient>
    <linearGradient id="redBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9d90" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#d64a3e" stop-opacity="0.94"/>
    </linearGradient>
    <linearGradient id="street" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3e8d6a" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#164a38" stop-opacity="0.94"/>
    </linearGradient>
    <linearGradient id="outerRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0c15a" stop-opacity="0.80"/>
      <stop offset="0.5" stop-color="#7fb8d6" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#f0b429" stop-opacity="0.60"/>
    </linearGradient>
    <filter id="blurXL" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="58"/>
    </filter>
    <filter id="blurM" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="panelShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="26" flood-color="#000000" flood-opacity="0.46"/>
    </filter>
    <filter id="candleShadow" x="-50%" y="-40%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <filter id="priceGlow" x="-180%" y="-180%" width="460%" height="460%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="14" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.12"/>
      </feComponentTransfer>
    </filter>
    <clipPath id="outerClip">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
    <clipPath id="panelClip">
      <rect x="34" y="34" width="444" height="444" rx="92"/>
    </clipPath>
  </defs>

  <g clip-path="url(#outerClip)">
    <rect width="512" height="512" fill="url(#bg)"/>

    <!-- blurred market light behind the glass -->
    <g filter="url(#blurXL)">
      <ellipse cx="140" cy="110" rx="180" ry="150" fill="url(#amberGlow)"/>
      <ellipse cx="420" cy="260" rx="180" ry="180" fill="url(#cyanGlow)"/>
      <ellipse cx="210" cy="452" rx="220" ry="130" fill="url(#greenGlow)"/>
      <ellipse cx="120" cy="350" rx="130" ry="130" fill="url(#redGlow)"/>
    </g>

    <!-- frosted pane -->
    <rect x="34" y="34" width="444" height="444" rx="92" fill="url(#glass)" filter="url(#panelShadow)"/>
    <rect x="34" y="34" width="444" height="444" rx="92" fill="none" stroke="url(#rim)" stroke-width="1.8"/>

    <g clip-path="url(#panelClip)">
      <ellipse cx="118" cy="106" rx="146" ry="100" fill="#ffffff" opacity="0.08" filter="url(#blurM)"/>
      <ellipse cx="416" cy="408" rx="150" ry="100" fill="#5ad1ff" opacity="0.04" filter="url(#blurM)"/>
      <rect x="34" y="34" width="444" height="444" filter="url(#noise)" opacity="0.50"/>

      <!-- glass catchlights -->
      <path d="M86 97 Q256 52 426 97" fill="none" stroke="#ffffff" stroke-opacity="0.40" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M62 152 Q238 104 450 158" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="10" stroke-linecap="round" filter="url(#blurM)"/>

      <!-- faint chart grid -->
      <g stroke="#ffffff" stroke-opacity="0.075" stroke-width="1">
        <path d="M100 220 H416"/>
        <path d="M100 286 H416"/>
        <path d="M100 352 H416"/>
        <path d="M180 180 V386"/>
        <path d="M270 180 V386"/>
        <path d="M360 180 V386"/>
      </g>

      <!-- street / chart baseline -->
      <path d="M92 388 H428" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5" stroke-linecap="round"/>
      <g stroke="#ffffff" stroke-opacity="0.24" stroke-width="1.2" stroke-linecap="round">
        <path d="M141 388 V395"/>
        <path d="M231 388 V395"/>
        <path d="M321 388 V395"/>
        <path d="M411 388 V395"/>
      </g>

      <!-- glass street base -->
      <rect x="88" y="402" width="336" height="38" rx="19" fill="url(#street)" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.3"/>
      <path d="M126 421 H386" stroke="#f0c15a" stroke-opacity="0.48" stroke-width="1.4" stroke-dasharray="10 9" stroke-linecap="round"/>
      <path d="M108 409 H394" stroke="#c7f6ff" stroke-opacity="0.20" stroke-width="1" stroke-linecap="round"/>

      <!-- close-price trend line (behind bodies) -->
      <path d="M141 310 L231 258 L321 282 L411 190"
            fill="none" stroke="#f0c15a" stroke-opacity="0.88" stroke-width="4"
            stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="411" cy="190" r="12" fill="#f0c15a" opacity="0.28" filter="url(#priceGlow)"/>
      <circle cx="411" cy="190" r="4.5" fill="#ffe6a4"/>

      <!-- candlesticks -->
      <g filter="url(#candleShadow)">
        <!-- candle 1: red -->
        <path d="M141 292 V388" stroke="#ffb8ae" stroke-opacity="0.90" stroke-width="4" stroke-linecap="round"/>
        <rect x="120" y="310" width="42" height="62" rx="7" fill="url(#redBody)" stroke="#ffffff" stroke-opacity="0.42" stroke-width="1.2"/>
        <path d="M128 318 H154" stroke="#ffffff" stroke-opacity="0.36" stroke-width="1.2" stroke-linecap="round"/>

        <!-- candle 2: green -->
        <path d="M231 238 V364" stroke="#b8ffe0" stroke-opacity="0.90" stroke-width="4" stroke-linecap="round"/>
        <rect x="210" y="258" width="42" height="88" rx="7" fill="url(#greenBody)" stroke="#ffffff" stroke-opacity="0.42" stroke-width="1.2"/>
        <path d="M218 266 H246" stroke="#ffffff" stroke-opacity="0.38" stroke-width="1.2" stroke-linecap="round"/>

        <!-- candle 3: red pullback -->
        <path d="M321 262 V360" stroke="#ffb8ae" stroke-opacity="0.90" stroke-width="4" stroke-linecap="round"/>
        <rect x="300" y="282" width="42" height="64" rx="7" fill="url(#redBody)" stroke="#ffffff" stroke-opacity="0.42" stroke-width="1.2"/>
        <path d="M308 290 H334" stroke="#ffffff" stroke-opacity="0.36" stroke-width="1.2" stroke-linecap="round"/>

        <!-- candle 4: green breakout -->
        <path d="M411 168 V328" stroke="#b8ffe0" stroke-opacity="0.90" stroke-width="4" stroke-linecap="round"/>
        <rect x="390" y="190" width="42" height="120" rx="7" fill="url(#greenBody)" stroke="#ffffff" stroke-opacity="0.42" stroke-width="1.2"/>
        <path d="M398 198 H426" stroke="#ffffff" stroke-opacity="0.38" stroke-width="1.2" stroke-linecap="round"/>
      </g>

      <!-- compact price marker -->
      <g>
        <rect x="358" y="126" width="74" height="30" rx="15" fill="#101f30" fill-opacity="0.82" stroke="#f0c15a" stroke-opacity="0.46" stroke-width="1"/>
        <path d="M372 141 L380 149 L392 133" fill="none" stroke="#8ff0bd" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="414" cy="141" r="3" fill="#f0c15a" opacity="0.85"/>
      </g>
    </g>

    <!-- outer glass edge -->
    <rect x="2.5" y="2.5" width="507" height="507" rx="112" fill="none" stroke="url(#outerRim)" stroke-width="2"/>
  </g>
</svg>
